# PIPELINE DEFINITION
# Name: espl-training-pipeline
# Inputs:
#    custom_priority_queue: str [Default: '']
#    notifications: list [Default: []]
#    params: dict [Default: {'max_tokens': 8192.0, 'test_dataset_size': 20.0, 'learning_rate': 5e-06, 'train_mode': 'evolution', 'source_sha': '5b98de127889b442d176104921f60a4968a19e89', 'training_microbatch_size': 1.0, 'n_epochs': 3.0, 'crossover_prob': 0.5, 'dataset_seed': 42.0, 'model_name': 'Qwen/Qwen3-4B', 'run_name': 'qwen3-4b-vllm-evolution-3ep-8k', 'eval_every': 18.0, 'dataset_pair': 'aimo_beyondaime', 'save_every': 1.0, 'solution_token_budget': 7000.0, 'num_parallel_programs': 2.0, 'group_size': 4.0, 'batch_size': 5.0, 'rl_loss_fn': 'cispo', 'enable_shared_memory': False, 'hf_home': '', 'lora_rank': 32.0, 'checkpoint_root': '', 'dataset_size': 90.0}]
#    run_priority: str [Default: '']
components:
  comp-train-espl:
    executorLabel: exec-train-espl
    inputDefinitions:
      parameters:
        params:
          parameterType: STRUCT
    outputDefinitions:
      artifacts:
        convergence_chart:
          artifactType:
            schemaTitle: system.Chart
            schemaVersion: 0.0.1
        efficiency_chart:
          artifactType:
            schemaTitle: system.Chart
            schemaVersion: 0.0.1
        evolution_history:
          artifactType:
            schemaTitle: system.Table
            schemaVersion: 0.0.1
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        performance_chart:
          artifactType:
            schemaTitle: system.Chart
            schemaVersion: 0.0.1
        rollout_samples:
          artifactType:
            schemaTitle: system.Table
            schemaVersion: 0.0.1
        step_metrics:
          artifactType:
            schemaTitle: system.Table
            schemaVersion: 0.0.1
        trained_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: NUMBER_INTEGER
deploymentSpec:
  executors:
    exec-train-espl:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_espl
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location --index-url https://download.pytorch.org/whl/cu128\
          \ --extra-index-url https://pypi.org/simple --trusted-host download.pytorch.org\
          \ --trusted-host pypi.org 'torch==2.8.0' 'torchvision==0.23.0'\
          \ 'urllib3>=1.26.4,<2' 'transformers==4.57.6' 'peft==0.19.1' 'accelerate==1.14.0'\
          \ 'tinker==0.6.3' 'https://files.pythonhosted.org/packages/3c/eb/77789ad6f1807328a61c205881580546af597f60334f1f96fd4f3bb6e929/chz-0.4.0-py3-none-any.whl#sha256=5db5ffe42f6be38f1c37e1b18f0d5559572ee8a8dc941116e67f1bd5396e2a9b'\
          \ 'datasets' 'rich' 'math-verify' 'vllm==0.10.2' 'plotly==6.3.0'  &&  python3\
          \ -m pip install --quiet --no-warn-script-location --index-url https://download.pytorch.org/whl/cu128\
          \ --extra-index-url https://pypi.org/simple --trusted-host download.pytorch.org\
          \ --trusted-host pypi.org 'kfp==2.14.6' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_espl(\n    params: Dict[str, Any],\n    trained_model:\
          \ Output[Model],\n    metrics: Output[Metrics],\n    performance_chart:\
          \ Output[Dataset],\n    convergence_chart: Output[Dataset],\n    efficiency_chart:\
          \ Output[Dataset],\n    step_metrics: Output[Dataset],\n    rollout_samples:\
          \ Output[Dataset],\n    evolution_history: Output[Dataset],\n) -> int:\n\
          \    import json\n    import os\n    import pathlib\n    import shutil\n\
          \    import subprocess\n    import sys\n    import tarfile\n    import urllib.request\n\
          \    import zipfile\n\n    import torch\n\n    cfg = dict(params)\n    print(\n\
          \        \"PyTorch runtime:\",\n        f\"torch={torch.__version__}\",\n\
          \        f\"cuda_build={torch.version.cuda}\",\n        f\"cuda_available={torch.cuda.is_available()}\"\
          ,\n    )\n    if not torch.cuda.is_available():\n        raise RuntimeError(\"\
          Aviflow task started without a visible CUDA GPU\")\n\n    source_sha = str(cfg[\"\
          source_sha\"]).strip()\n    if len(source_sha) != 40 or any(char not in\
          \ \"0123456789abcdef\" for char in source_sha):\n        raise ValueError(\"\
          source_sha must be a full lowercase 40-character Git SHA\")\n\n    source_dir\
          \ = pathlib.Path(\"/tmp/evolutionrl-source\")\n    archive_path = pathlib.Path(\"\
          /tmp/evolutionrl-source.zip\")\n    if source_dir.exists():\n        shutil.rmtree(source_dir)\n\
          \    source_dir.mkdir(parents=True)\n    archive_url = (\n        \"https://github.com/Hermeska/EvolutionRL/archive/\"\
          \n        f\"{source_sha}.zip\"\n    )\n    urllib.request.urlretrieve(archive_url,\
          \ archive_path)\n    with zipfile.ZipFile(archive_path) as archive:\n  \
          \      archive.extractall(source_dir)\n\n    recipes = list(\n        source_dir.glob(\n\
          \            \"*/tinker_cookbook/recipes/system_prompt_learning_rl.py\"\n\
          \        )\n    )\n    if len(recipes) != 1:\n        raise RuntimeError(\n\
          \            f\"Expected one E-SPL recipe in {archive_url}, found {len(recipes)}\"\
          \n        )\n    recipe = recipes[0]\n    project_root = recipe.parents[2]\n\
          \n    # Source archives do not contain .git, and minimal GPU images may\
          \ not\n    # contain the git executable either. Make code-state logging\
          \ treat both\n    # cases as \"not in a Git repository\" instead of aborting\
          \ training.\n    code_state_path = project_root / \"tinker_cookbook\" /\
          \ \"utils\" / \"code_state.py\"\n    code_state_source = code_state_path.read_text(encoding=\"\
          utf-8\")\n    old_handler = \"except subprocess.CalledProcessError:\"\n\
          \    new_handler = \"except (subprocess.CalledProcessError, FileNotFoundError):\"\
          \n    if old_handler in code_state_source:\n        code_state_path.write_text(\n\
          \            code_state_source.replace(old_handler, new_handler, 1),\n \
          \           encoding=\"utf-8\",\n        )\n\n    # The Qwen tokenizer uses\
          \ EOS as padding. Transformers cannot infer a\n    # reliable mask in that\
          \ case, so pass the all-ones mask explicitly for\n    # each unpadded sampling\
          \ prompt.\n    local_client_path = project_root / \"tinker_cookbook\" /\
          \ \"local_backend\" / \"client.py\"\n    local_client_source = local_client_path.read_text(encoding=\"\
          utf-8\")\n    generate_input = \"                    input_ids=input_ids,\\\
          n\"\n    generate_input_with_mask = (\n        generate_input\n        +\
          \ \"                    attention_mask=torch.ones_like(input_ids),\\n\"\n\
          \    )\n    if (\n        generate_input in local_client_source\n      \
          \  and generate_input_with_mask not in local_client_source\n    ):\n   \
          \     local_client_path.write_text(\n            local_client_source.replace(\n\
          \                generate_input,\n                generate_input_with_mask,\n\
          \                1,\n            ),\n            encoding=\"utf-8\",\n \
          \       )\n\n    run_name = str(cfg[\"run_name\"])\n    persistent_root\
          \ = str(cfg.get(\"checkpoint_root\", \"\")).strip()\n    run_root = (\n\
          \        pathlib.Path(persistent_root)\n        if persistent_root\n   \
          \     else pathlib.Path(\"/tmp\") / \"espl\" / run_name\n    )\n    checkpoint_dir\
          \ = run_root / \"checkpoints\"\n    log_dir = run_root / \"logs\"\n    checkpoint_dir.mkdir(parents=True,\
          \ exist_ok=True)\n    log_dir.mkdir(parents=True, exist_ok=True)\n\n   \
          \ env = os.environ.copy()\n    env[\"PYTHONUNBUFFERED\"] = \"1\"\n    env[\"\
          PYTHONPATH\"] = os.pathsep.join(\n        [str(project_root), env.get(\"\
          PYTHONPATH\", \"\")]\n    ).rstrip(os.pathsep)\n    env[\"PYTORCH_CUDA_ALLOC_CONF\"\
          ] = \"expandable_segments:True\"\n    if str(cfg.get(\"hf_home\", \"\")).strip():\n\
          \        env[\"HF_HOME\"] = str(cfg[\"hf_home\"]).strip()\n\n    model_name\
          \ = str(cfg[\"model_name\"])\n    command = [\n        sys.executable,\n\
          \        \"-u\",\n        str(recipe),\n        \"use_local_backend=True\"\
          ,\n        f\"model_name={model_name}\",\n        f\"local_model_name={model_name}\"\
          ,\n        \"local_num_gpus=1\",\n        \"local_dtype=bfloat16\",\n  \
          \      \"local_attention_backend=sdpa\",\n        \"local_sampling_backend=vllm\"\
          ,\n        \"local_vllm_device=cuda:1\",\n        \"local_vllm_max_model_len=16384\"\
          ,\n        \"local_vllm_gpu_memory_utilization=0.9\",\n        f\"local_vllm_max_lora_rank={cfg['lora_rank']}\"\
          ,\n        f\"local_training_microbatch_size={cfg['training_microbatch_size']}\"\
          ,\n        f\"local_lora_rank={cfg['lora_rank']}\",\n        f\"local_max_tokens={cfg['max_tokens']}\"\
          ,\n        f\"solution_token_budget={cfg['solution_token_budget']}\",\n\
          \        f\"learning_rate={cfg['learning_rate']}\",\n        f\"batch_size={cfg['batch_size']}\"\
          ,\n        f\"group_size={cfg['group_size']}\",\n        f\"num_parallel_programs={cfg['num_parallel_programs']}\"\
          ,\n        f\"n_epochs={cfg['n_epochs']}\",\n        f\"dataset_size={cfg['dataset_size']}\"\
          ,\n        f\"dataset_seed={cfg['dataset_seed']}\",\n        f\"test_dataset_size={cfg['test_dataset_size']}\"\
          ,\n        f\"dataset_pair={cfg['dataset_pair']}\",\n        f\"enable_shared_memory={cfg['enable_shared_memory']}\"\
          ,\n        f\"train_mode={cfg['train_mode']}\",\n        f\"rl_loss_fn={cfg['rl_loss_fn']}\"\
          ,\n        f\"crossover_prob={cfg['crossover_prob']}\",\n        \"resume_strategy=last\"\
          ,\n        f\"save_every={cfg['save_every']}\",\n        f\"eval_every={cfg['eval_every']}\"\
          ,\n        f\"experiment_name={run_name}\",\n        f\"log_path={log_dir}\"\
          ,\n        f\"local_checkpoint_dir={checkpoint_dir}\",\n    ]\n    subprocess.run(command,\
          \ cwd=run_root, env=env, check=True)\n\n    stats_path = (\n        run_root\
          \ / \"data\" / \"math\" / \"train\" / run_name / \"stats.json\"\n    )\n\
          \    completed_steps = []\n    stats = {}\n    if stats_path.exists():\n\
          \        stats = json.loads(stats_path.read_text(encoding=\"utf-8\"))\n\
          \        completed_steps = [\n            value\n            for _, value\
          \ in sorted(\n                stats.items(),\n                key=lambda\
          \ item: int(item[0].removeprefix(\"step_\")),\n            )\n         \
          \   if value.get(\"complete\")\n        ]\n\n    metrics.log_metric(\"completed_steps\"\
          , float(len(completed_steps)))\n    if completed_steps:\n        rollout\
          \ = completed_steps[-1].get(\"rollout\", {})\n        if \"Agg_avg_reward\"\
          \ in rollout:\n            metrics.log_metric(\n                \"final_reward\"\
          ,\n                float(rollout[\"Agg_avg_reward\"]),\n            )\n\
          \        pass_keys = sorted(\n            key for key in rollout if key.startswith(\"\
          Agg_Pass@\")\n        )\n        if pass_keys:\n            metrics.log_metric(\n\
          \                \"final_pass_at_k\",\n                float(rollout[pass_keys[-1]]),\n\
          \            )\n\n        full_eval_rewards = [\n            float(step[\"\
          test\"][\"eval_avg_reward\"])\n            for step in completed_steps\n\
          \            if step.get(\"test\", {}).get(\"full_eval\")\n            and\
          \ \"eval_avg_reward\" in step[\"test\"]\n        ]\n        if full_eval_rewards:\n\
          \            metrics.log_metric(\"best_eval_reward\", max(full_eval_rewards))\n\
          \            metrics.log_metric(\"final_eval_reward\", full_eval_rewards[-1])\n\
          \n    metric_rows = []\n    metrics_file = log_dir / \"metrics.jsonl\"\n\
          \    if metrics_file.exists():\n        with metrics_file.open(encoding=\"\
          utf-8\") as metric_stream:\n            for global_step, line in enumerate(metric_stream):\n\
          \                row = json.loads(line)\n                metric_rows.append({\"\
          global_step\": global_step, **row})\n\n    if metric_rows:\n        import\
          \ plotly.graph_objects as go\n        from plotly.subplots import make_subplots\n\
          \n        steps = [row[\"global_step\"] for row in metric_rows]\n      \
          \  success_rates = [\n            float(row.get(\"rollout/success_rate\"\
          , 0.0)) for row in metric_rows\n        ]\n        metrics.log_metric(\"\
          best_success_rate\", max(success_rates))\n        metrics.log_metric(\"\
          final_success_rate\", success_rates[-1])\n        metrics.log_metric(\n\
          \            \"final_success_rate_ma5\",\n            float(metric_rows[-1].get(\"\
          convergence/success_rate_ma5\", 0.0)),\n        )\n        metrics.log_metric(\n\
          \            \"final_convergence_slope5\",\n            float(metric_rows[-1].get(\"\
          convergence/success_rate_slope5\", 0.0)),\n        )\n        performance\
          \ = go.Figure()\n        for key, label in [\n            (\"rollout/Agg_avg_reward\"\
          , \"Train reward\"),\n            (\"rollout/Agg_Pass@4\", \"Train Pass@4\"\
          ),\n        ]:\n            performance.add_trace(go.Scatter(\n        \
          \        x=steps,\n                y=[row.get(key) for row in metric_rows],\n\
          \                mode=\"lines+markers\",\n                name=label,\n\
          \            ))\n        full_eval_rows = [\n            row for row in\
          \ metric_rows if row.get(\"testing/full_eval\") is True\n        ]\n   \
          \     performance.add_trace(go.Scatter(\n            x=[row[\"global_step\"\
          ] for row in full_eval_rows],\n            y=[row.get(\"testing/eval_avg_reward\"\
          ) for row in full_eval_rows],\n            mode=\"lines+markers\",\n   \
          \         name=\"Full eval reward\",\n            line={\"width\": 4},\n\
          \        ))\n        performance.update_layout(\n            title=\"E-SPL\
          \ learning curves\",\n            xaxis_title=\"Global training step\",\n\
          \            yaxis_title=\"Reward / pass rate\",\n            yaxis={\"\
          range\": [0, 1]},\n            hovermode=\"x unified\",\n        )\n   \
          \     performance_path = pathlib.Path(performance_chart.path)\n        performance_path.parent.mkdir(parents=True,\
          \ exist_ok=True)\n        performance.write_json(performance_path)\n   \
          \     performance_chart.metadata[\"title\"] = \"E-SPL learning curves\"\n\
          \n        convergence = make_subplots(specs=[[{\"secondary_y\": True}]])\n\
          \        convergence.add_trace(go.Scatter(\n            x=steps,\n     \
          \       y=[row.get(\"rollout/success_rate\", 0) for row in metric_rows],\n\
          \            mode=\"lines+markers\",\n            name=\"Success rate\"\
          ,\n        ), secondary_y=False)\n        convergence.add_trace(go.Scatter(\n\
          \            x=steps,\n            y=[row.get(\"convergence/success_rate_ma5\"\
          , 0) for row in metric_rows],\n            mode=\"lines\",\n           \
          \ name=\"Success rate MA(5)\",\n            line={\"width\": 4},\n     \
          \   ), secondary_y=False)\n        convergence.add_trace(go.Scatter(\n \
          \           x=steps,\n            y=[row.get(\"convergence/success_rate_slope5\"\
          , 0) for row in metric_rows],\n            mode=\"lines+markers\",\n   \
          \         name=\"Convergence slope (5 steps)\",\n        ), secondary_y=True)\n\
          \        convergence.update_layout(\n            title=\"Evolution convergence\
          \ and success rate\",\n            xaxis_title=\"Global training step\"\
          ,\n            hovermode=\"x unified\",\n        )\n        convergence.update_yaxes(title_text=\"\
          Success rate\", range=[0, 1], secondary_y=False)\n        convergence.update_yaxes(title_text=\"\
          Slope\", secondary_y=True)\n        convergence_path = pathlib.Path(convergence_chart.path)\n\
          \        convergence_path.parent.mkdir(parents=True, exist_ok=True)\n  \
          \      convergence.write_json(convergence_path)\n        convergence_chart.metadata[\"\
          title\"] = \"Evolution convergence and success rate\"\n\n        efficiency\
          \ = make_subplots(specs=[[{\"secondary_y\": True}]])\n        efficiency.add_trace(go.Bar(\n\
          \            x=steps,\n            y=[row.get(\"time/total\") for row in\
          \ metric_rows],\n            name=\"Step time (s)\",\n        ), secondary_y=False)\n\
          \        efficiency.add_trace(go.Scatter(\n            x=steps,\n      \
          \      y=[row.get(\"rl/training_datums\", 0) for row in metric_rows],\n\
          \            mode=\"lines+markers\",\n            name=\"RL datums\",\n\
          \        ), secondary_y=True)\n        efficiency.add_trace(go.Scatter(\n\
          \            x=steps,\n            y=[row.get(\"rollout/truncation_rate\"\
          , 0) for row in metric_rows],\n            mode=\"lines+markers\",\n   \
          \         name=\"Train truncation rate\",\n        ), secondary_y=True)\n\
          \        efficiency.update_layout(\n            title=\"Step time and useful\
          \ RL signal\",\n            xaxis_title=\"Global training step\",\n    \
          \        hovermode=\"x unified\",\n        )\n        efficiency.update_yaxes(title_text=\"\
          Seconds\", secondary_y=False)\n        efficiency.update_yaxes(title_text=\"\
          Training datums\", secondary_y=True)\n        efficiency_path = pathlib.Path(efficiency_chart.path)\n\
          \        efficiency_path.parent.mkdir(parents=True, exist_ok=True)\n   \
          \     efficiency.write_json(efficiency_path)\n        efficiency_chart.metadata[\"\
          title\"] = \"Step time and useful RL signal\"\n\n        columns = [\n \
          \           \"step\", \"epoch\", \"batch\", \"train_reward\", \"train_pass_at_4\"\
          ,\n            \"eval_reward\", \"full_eval\", \"rl_datums\", \"step_seconds\"\
          ,\n            \"train_truncation_rate\", \"eval_truncation_rate\",\n  \
          \          \"success_rate_ma5\", \"success_rate_slope5\",\n        ]\n \
          \       table_rows = []\n        for row, stats_step in zip(metric_rows,\
          \ completed_steps):\n            table_rows.append([\n                row[\"\
          global_step\"],\n                stats_step.get(\"epoch\", -1),\n      \
          \          stats_step.get(\"batch\", -1),\n                float(row.get(\"\
          rollout/Agg_avg_reward\", 0.0)),\n                float(row.get(\"rollout/Agg_Pass@4\"\
          , 0.0)),\n                float(row.get(\"testing/eval_avg_reward\", 0.0)),\n\
          \                str(bool(row.get(\"testing/full_eval\", False))),\n   \
          \             int(row.get(\"rl/training_datums\", 0)),\n               \
          \ float(row.get(\"time/total\", 0.0)),\n                float(row.get(\"\
          rollout/truncation_rate\", 0.0)),\n                float(row.get(\"testing/truncation_rate\"\
          , 0.0)),\n                float(row.get(\"convergence/success_rate_ma5\"\
          , 0.0)),\n                float(row.get(\"convergence/success_rate_slope5\"\
          , 0.0)),\n            ])\n        import csv\n\n        table_path = pathlib.Path(step_metrics.path)\n\
          \        table_path.parent.mkdir(parents=True, exist_ok=True)\n        with\
          \ table_path.open(\"w\", encoding=\"utf-8\", newline=\"\") as table_file:\n\
          \            writer = csv.writer(table_file, quoting=csv.QUOTE_ALL)\n  \
          \          writer.writerow(columns)\n            writer.writerows(table_rows)\n\
          \        step_metrics.metadata[\"cols\"] = len(columns)\n        step_metrics.metadata[\"\
          rows\"] = len(table_rows) + 1\n\n    import csv\n\n    experiment_dir =\
          \ run_root / \"data\" / \"math\" / \"train\" / run_name\n    rollout_columns\
          \ = [\n        \"step\", \"program_slot\", \"program_id\", \"reward\", \"\
          problem\",\n        \"query_prompt\", \"llm_response\", \"principles\",\
          \ \"groundtruth\",\n    ]\n    rollout_rows = []\n    for step_dir in sorted(\n\
          \        experiment_dir.glob(\"step_*\"),\n        key=lambda path: int(path.name.removeprefix(\"\
          step_\")),\n    ):\n        step_number = int(step_dir.name.removeprefix(\"\
          step_\"))\n        step_stats = stats.get(f\"step_{step_number}\", {}) if\
          \ stats_path.exists() else {}\n        program_ids = step_stats.get(\"sampled_program_ids\"\
          , [])\n        for program_dir in sorted(step_dir.glob(\"sampled_program_*\"\
          )):\n            program_slot = int(program_dir.name.removeprefix(\"sampled_program_\"\
          ))\n            principles_path = program_dir / \"principles_to_mutate.json\"\
          \n            principles = (\n                principles_path.read_text(encoding=\"\
          utf-8\")\n                if principles_path.exists() else \"{}\"\n    \
          \        )\n            rollout_path = program_dir / \"rollout.jsonl\"\n\
          \            if not rollout_path.exists():\n                continue\n \
          \           with rollout_path.open(encoding=\"utf-8\") as rollout_stream:\n\
          \                for line in rollout_stream:\n                    sample\
          \ = json.loads(line)\n                    trajectory = sample.get(\"trajectories\"\
          , [{}])[0].get(\"trajectory\", [])\n                    query_prompt = next(\n\
          \                        (message.get(\"content\", \"\") for message in\
          \ trajectory if message.get(\"role\") == \"user\"),\n                  \
          \      \"\",\n                    )\n                    response = next(\n\
          \                        (message.get(\"content\", \"\") for message in\
          \ trajectory if message.get(\"role\") == \"assistant\"),\n             \
          \           \"\",\n                    )\n                    rollout_rows.append([\n\
          \                        step_number,\n                        program_slot,\n\
          \                        program_ids[program_slot] if program_slot < len(program_ids)\
          \ else -1,\n                        float(sample.get(\"reward\", 0.0)),\n\
          \                        sample.get(\"problem\", \"\"),\n              \
          \          query_prompt,\n                        response,\n          \
          \              principles,\n                        str(sample.get(\"groundtruth\"\
          , \"\")),\n                    ])\n\n    rollout_path = pathlib.Path(rollout_samples.path)\n\
          \    rollout_path.parent.mkdir(parents=True, exist_ok=True)\n    with rollout_path.open(\"\
          w\", encoding=\"utf-8\", newline=\"\") as rollout_file:\n        writer\
          \ = csv.writer(rollout_file, quoting=csv.QUOTE_ALL)\n        writer.writerow(rollout_columns)\n\
          \        writer.writerows(rollout_rows)\n    rollout_samples.metadata[\"\
          cols\"] = len(rollout_columns)\n    rollout_samples.metadata[\"rows\"] =\
          \ len(rollout_rows) + 1\n\n    programs_by_id = {}\n    for pool_path in\
          \ sorted(experiment_dir.glob(\"step_*/evolution_pool.json\")):\n       \
          \ pool_state = json.loads(pool_path.read_text(encoding=\"utf-8\"))\n   \
          \     for program in pool_state.get(\"evolution_pool\", []):\n         \
